name: Feature request
description: Something INTERCEPTOR should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two project rules shape what gets accepted, and they are worth knowing before you
        write:

        - **No decorative settings.** Every option has a real effect in the code.
        - **Nothing that claims what it cannot prove.** The security analyser only reports
          findings backed by captured evidence. "Warn when a hardening header is missing" is
          deliberately out — absent hardening is a missed opportunity, not a vulnerability.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out, or do?
      description: Describe the situation, not the solution. It often has a better answer than the one we would guess.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another tool, a manual step, or not at all.

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If it belongs in an existing view or toolbox family, say which.

  - type: checkboxes
    id: proof
    attributes:
      label: If this is a new analyser finding
      options:
        - label: I can state the observable evidence that proves it, from captured data alone.
