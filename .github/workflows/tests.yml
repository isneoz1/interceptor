name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Les six suites prennent deux secondes. Dix minutes laissent toute la
    # marge du monde a un runner lent, et font echouer en dix minutes ce qui
    # tournerait sinon six heures : un test qui se bloque doit se voir.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install: the extension and its tests are plain ES
      # modules. `npm test` runs the five suites directly.
      - name: Run the test suites
        run: npm test

  build:
    name: Package
    runs-on: windows-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # build.ps1 re-runs every suite and refuses to package if one fails.
      - name: Verify and package
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: interceptor-xpi
          path: dist/*.xpi
          if-no-files-found: error
